name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, and dedicated-server GameTests
        run: ./gradlew --no-daemon build
      - name: Disabled-overhaul vanilla regression
        run: ./gradlew --no-daemon runGameTest -PvanillaMinecartTests=true
      - uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-reports
          path: |
            build/reports/
            build/test-results/
            build/run/**/logs/
  client:
    strategy:
      fail-fast: false
      matrix:
        surface-disabled: [false, true]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display and software renderer
        run: sudo bash scripts/install-client-test-deps.sh
      - name: Client world smoke test
        run: bash scripts/run-client-smoke-test.sh -PsurfaceGenerationDisabled=${{ matrix.surface-disabled }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-test-evidence-surface-disabled-${{ matrix.surface-disabled }}
          path: |
            build/diagnostics/
            build/run/**/crash-reports/
            build/run/**/screenshots/
            build/run/**/surface-proof.json
            build/run/**/logs/
            build/reports/
