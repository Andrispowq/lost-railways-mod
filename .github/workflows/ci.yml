name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, and dedicated-server GameTests
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-reports
          path: |
            build/reports/
            build/test-results/
            build/run/**/logs/
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display and software renderer
        run: sudo bash scripts/install-client-test-deps.sh
      - name: Client world smoke test
        run: bash scripts/run-client-smoke-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-test-evidence
          path: |
            build/diagnostics/
            build/run/**/crash-reports/
            build/run/**/screenshots/
            build/run/**/logs/
            build/reports/
